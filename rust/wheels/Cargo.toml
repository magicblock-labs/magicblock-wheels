[package]
name = "wheels"
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-copy account layouts and validation helpers for Solana programs"
edition = "2021"

[dependencies]
bytemuck = { version = "1", default-features = false }
pinocchio = { version = "0.10.2", features = ["cpi"] }
pinocchio-log = "0.5.1"
solana-address = { version = "2", default-features = false, features = ["bytemuck"] }
wheels-macros = { path = "../wheels-macros", version = "=0.1.0-alpha.1" }
